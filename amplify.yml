# AWS Amplify Hosting build spec. Amplify picks this up automatically when the
# app is connected to this GitHub repo. The site is a static export, so the app
# should be created as a static (WEB) app; see docs/DEPLOY.md.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || true
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
