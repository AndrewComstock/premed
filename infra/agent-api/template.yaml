AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Halcyra agent API. A small HTTPS backend the static site calls to reach AI agents:
  POST /chat proxies to Amazon Bedrock Agents, and POST /copilot/token issues a
  Microsoft Copilot Studio Direct Line token. Nothing here runs until agents are configured.
  It also serves the customer portal (/portal/*): sign-in against a DynamoDB users table
  and the portal data for the signed-in account.

Parameters:
  AllowedOrigin:
    Type: CommaDelimitedList
    Default: "*"
    Description: >
      Comma-separated site origins allowed by CORS, e.g.
      https://main.d123abc.amplifyapp.com,http://localhost:3000
  BedrockAgentMap:
    Type: String
    Default: "{}"
    Description: >
      JSON mapping site agent ids (src/agents/registry.ts) to Bedrock agents, e.g.
      {"halcyra-assistant":{"agentId":"ABCD1234","aliasId":"TSTALIASID"}}
  CopilotDirectLineSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN holding a Copilot Studio Direct Line secret.

Conditions:
  HasCopilotSecret: !Not [!Equals [!Ref CopilotDirectLineSecretArn, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Join [",", !Ref AllowedOrigin]

Resources:
  AgentHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # A list parameter, not !Split: SAM mistranslates an intrinsic here and
        # silently drops the whole CORS config.
        AllowOrigins: !Ref AllowedOrigin
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]

  BedrockChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: bedrock-chat.handler
      Environment:
        Variables:
          BEDROCK_AGENT_MAP: !Ref BedrockAgentMap
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeAgent
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentHttpApi
            Path: /chat
            Method: POST

  CopilotTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: copilot-token.handler
      Environment:
        Variables:
          DIRECT_LINE_SECRET_ARN: !Ref CopilotDirectLineSecretArn
      Policies:
        - !If
          - HasCopilotSecret
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CopilotDirectLineSecretArn
          - !Ref AWS::NoValue
      Events:
        Token:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentHttpApi
            Path: /copilot/token
            Method: POST

  # Customer portal. Tables are retained if the stack is deleted, so demo data and
  # users survive a teardown; delete them by hand if you really want them gone.
  PortalUsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: halcyra-portal-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: email, KeyType: HASH }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  PortalSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: halcyra-portal-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tokenHash, AttributeType: S }
      KeySchema:
        - { AttributeName: tokenHash, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }

  PortalDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: halcyra-portal-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  PortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: portal.handler
      Timeout: 10
      Environment:
        Variables:
          PORTAL_USERS_TABLE: !Ref PortalUsersTable
          PORTAL_SESSIONS_TABLE: !Ref PortalSessionsTable
          PORTAL_DATA_TABLE: !Ref PortalDataTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PortalUsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PortalDataTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PortalSessionsTable }
      Events:
        Login:
          Type: HttpApi
          Properties: { ApiId: !Ref AgentHttpApi, Path: /portal/login, Method: POST }
        Logout:
          Type: HttpApi
          Properties: { ApiId: !Ref AgentHttpApi, Path: /portal/logout, Method: POST }
        Me:
          Type: HttpApi
          Properties: { ApiId: !Ref AgentHttpApi, Path: /portal/me, Method: GET }
        ActivateIQ:
          Type: HttpApi
          Properties: { ApiId: !Ref AgentHttpApi, Path: /portal/iq/activate, Method: POST }
        DeactivateIQ:
          Type: HttpApi
          Properties: { ApiId: !Ref AgentHttpApi, Path: /portal/iq/deactivate, Method: POST }

Outputs:
  AgentApiUrl:
    Description: Set this as NEXT_PUBLIC_AGENT_API_URL in the Amplify app's environment variables.
    Value: !Sub https://${AgentHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  PortalUsersTableName:
    Value: !Ref PortalUsersTable
  PortalDataTableName:
    Value: !Ref PortalDataTable
